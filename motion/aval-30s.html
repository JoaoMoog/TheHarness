<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aval · Motion 30s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#05132A; --blue:#195AB4; --sky:#8FB4E8; --paper:#FBFCFE;
  --ink2:#5B6B85; --line:#DCE6F4; --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#020913;overflow:hidden}
body{font-family:var(--sans);color:var(--navy);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;
  transform-origin:50% 50%;background:var(--navy)}
.abs{position:absolute;left:0;top:0}
.layer{position:absolute;inset:0;pointer-events:none}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* fundos */
#bgLight{background:var(--paper)}
#bgDark2{background:var(--navy)}
.rim{background:radial-gradient(circle at 50% 50%,#8FB4E8,#195AB4 70%)}
#bgLight,#bgDark2,.rim{-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#vignette{background:radial-gradient(120% 90% at 60% 50%,transparent 55%,rgba(2,8,20,.55) 100%)}
#scrim{background:linear-gradient(90deg,rgba(5,19,42,.97) 0%,rgba(5,19,42,.86) 36%,rgba(5,19,42,0) 62%)}
#world{transform-origin:50% 50%}

/* grade 3D */
#scene3d{perspective:1400px;perspective-origin:50% 50%}
#grid{position:absolute;left:960px;top:540px;width:0;height:0;transform-style:preserve-3d}
.tile{position:absolute;left:0;top:0;width:92px;height:92px;border-radius:22px;
  background:rgba(25,90,180,.13);border:1px solid rgba(143,180,232,.26);color:var(--sky);
  backface-visibility:hidden;will-change:transform,opacity,filter}
.tile svg{position:absolute;left:24px;top:24px;width:44px;height:44px}
#orb{width:720px;height:720px;border-radius:50%;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(251,252,254,.95) 0%,rgba(190,214,245,.6) 22%,rgba(143,180,232,.28) 44%,rgba(25,90,180,0) 70%)}
#orbRing{width:420px;height:420px;border-radius:50%;border:1.5px solid rgba(143,180,232,.8);
  box-shadow:0 0 40px rgba(143,180,232,.45),inset 0 0 40px rgba(143,180,232,.25)}

/* trio */
.tlabel{position:absolute;top:0;width:240px;text-align:center}
.tlabel b{display:block;font:400 38px/1 var(--serif);color:var(--navy)}
.tlabel span{display:block;margin-top:8px;font:500 15px/1.3 var(--sans);color:var(--ink2)}

/* manchetes */
.head{position:absolute;left:120px;top:322px;width:740px}
.kick{display:flex;align-items:center;gap:14px;font:600 14px/1 var(--sans);letter-spacing:.24em;
  text-transform:uppercase;margin-bottom:28px}
.kick i{display:block;height:1.5px;width:44px;background:currentColor;transform-origin:left center}
.h{font:400 90px/1.0 var(--serif);letter-spacing:-.015em}
.w{display:inline-block;margin-right:.2em;will-change:transform,opacity,filter}
.h em{font-style:italic;position:relative;display:inline-block;padding-right:.015em}
.ul{position:absolute;left:0;right:.04em;bottom:.02em;height:3px;border-radius:3px;background:var(--sky);
  transform-origin:left center;transform:scaleX(0)}

/* celular */
#phone{width:390px;height:800px;border-radius:62px;background:#0A1B36;transform-origin:50% 50%;
  box-shadow:inset 0 0 0 2px #22375C,inset 0 0 0 7px #0A1B36,0 60px 120px -30px rgba(5,19,42,.5),0 24px 48px -16px rgba(5,19,42,.3)}
.ph-screen{position:absolute;left:12px;top:12px;width:366px;height:776px;border-radius:50px;background:var(--paper);overflow:hidden}
.ph-island{position:absolute;left:140px;top:24px;width:110px;height:32px;border-radius:20px;background:var(--navy)}
.ph-screen .a{position:absolute}
.ph-time{left:34px;top:17px;font:600 15px/1 var(--sans)}
.ph-stat{right:28px;top:17px;display:flex;gap:6px;align-items:center}
.ph-brand{left:22px;top:64px;display:flex;align-items:center;gap:8px;font:400 27px/1 var(--serif)}
.ph-avatar{right:22px;top:60px;width:34px;height:34px;border-radius:50%;background:#E6EEFA;color:var(--blue);
  font:600 12px/34px var(--sans);text-align:center}
.ph-stepline{left:83px;top:131px;width:200px;height:1.5px;background:var(--line);transform-origin:left center}
.ph-stepfill{left:83px;top:131px;width:200px;height:1.5px;background:var(--blue);transform-origin:left center;transform:scaleX(0)}
.ph-step{top:112px;width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--blue)}
.ph-step svg{position:absolute;left:9px;top:9px;width:20px;height:20px}
.ph-steplab{top:160px;width:100px;text-align:center;font:500 11px/1 var(--sans);color:var(--ink2)}
.ph-title{left:22px;top:192px;font:400 30px/1 var(--serif)}
.ph-sub{left:22px;top:228px;font:400 12px/1 var(--sans);color:var(--ink2)}
.ph-input{left:20px;top:250px;width:326px;height:70px;border-radius:16px;background:#fff;border:1.5px solid var(--line)}
.ph-input small{position:absolute;left:16px;top:12px;font:500 11px/1 var(--sans);color:var(--ink2)}
.ph-input p{position:absolute;left:16px;top:34px;font:500 16px/1.2 var(--sans);color:var(--navy);white-space:nowrap}
.caret{display:inline-block;width:2px;height:18px;margin-left:1px;vertical-align:-3px;background:var(--blue)}
.ph-btn{left:20px;top:332px;width:326px;height:50px;border-radius:14px;background:var(--blue);color:#fff;overflow:hidden}
.ph-btn > div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 var(--sans)}
.ph-btn .shim{position:absolute;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);inset:0 auto 0 0;width:200%}
.ph-planh{left:22px;top:404px;font:600 10.5px/1 var(--sans);letter-spacing:.16em;color:var(--ink2)}
.ph-total{right:22px;top:395px;font:400 24px/1 var(--serif)}
.ph-bar{left:22px;top:428px;width:322px;height:8px;display:flex;gap:4px}
.ph-bar i{display:block;height:8px;border-radius:4px;transform-origin:left center}
.row{left:20px;width:326px;height:66px}
.rbody,.rghost{position:absolute;inset:0;border-radius:16px}
.rbody{background:#fff;border:1px solid var(--line);box-shadow:0 6px 16px -10px rgba(5,19,42,.18)}
.rghost{border:1.5px dashed #C6D5EC;display:flex;align-items:center;padding-left:18px;font:500 12px/1 var(--sans);color:#93A3BC}

/* conteúdo do marco (linha / chip) */
.mnum{position:absolute;left:14px;top:16px;width:34px;height:34px;border-radius:50%;color:#fff;font:400 18px/34px var(--serif);text-align:center}
.mname{position:absolute;left:60px;top:15px;font:600 15px/1 var(--sans);color:var(--navy)}
.msub{position:absolute;left:60px;top:37px;font:400 11.5px/1 var(--sans);color:var(--ink2)}
.mpct{position:absolute;right:16px;top:11px;font:400 24px/1 var(--serif);color:var(--navy)}
.mval{position:absolute;right:16px;top:39px;font:500 11.5px/1 var(--sans);color:var(--ink2)}
.mtag{position:absolute;right:86px;top:23px;padding:5px 9px;border-radius:20px;background:#F1F5FB;font:600 10.5px/1 var(--sans);color:var(--ink2)}
.chip{width:326px;height:66px;border-radius:16px;background:#fff;border:1px solid var(--line);transform-origin:50% 50%}

/* foto / prova */
#photo{width:460px;height:384px;border-radius:10px;background:#fff;padding:14px;transform-origin:50% 50%;
  box-shadow:0 40px 80px -30px rgba(5,19,42,.35),0 10px 24px -12px rgba(5,19,42,.2)}
#photo .img{position:relative;width:432px;height:324px;border-radius:4px;overflow:hidden}
#photo .cap{display:flex;justify-content:space-between;margin-top:14px;font:500 12px/1 var(--sans);color:var(--ink2)}
#scangrid{position:absolute;inset:0;background-image:linear-gradient(rgba(143,180,232,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(143,180,232,.35) 1px,transparent 1px);background-size:36px 36px}
#scanline{position:absolute;left:0;right:0;top:0;height:120px}
#scanline::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(143,180,232,0),rgba(143,180,232,.38))}
#scanline::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.5px;background:#fff;box-shadow:0 0 12px 3px rgba(143,180,232,.95)}
.brk{position:absolute;width:34px;height:34px;border:3px solid #fff}
.det{position:absolute;border:2px solid #fff;border-radius:6px;box-shadow:0 0 0 1px rgba(25,90,180,.4)}
.det span{position:absolute;left:-2px;top:-26px;padding:5px 8px;border-radius:6px;background:var(--blue);color:#fff;font:600 11px/1 var(--sans);white-space:nowrap}
#badge{right:-22px;top:-22px;left:auto;display:flex;align-items:center;gap:8px;padding:12px 18px 12px 14px;border-radius:30px;
  background:var(--blue);color:#fff;font:600 15px/1 var(--sans);box-shadow:0 16px 30px -12px rgba(25,90,180,.7);transform-origin:80% 50%}

/* cards de status */
.scard{width:380px;height:156px;border-radius:22px;background:#fff;border:1px solid var(--line);transform-origin:50% 50%;
  box-shadow:0 30px 60px -34px rgba(5,19,42,.28)}
.scard .in{position:absolute;inset:0}
.pill{position:absolute;left:20px;top:20px;display:flex;align-items:center;gap:7px;padding:8px 13px 8px 10px;border-radius:30px;font:600 13px/1 var(--sans)}
.pill svg{width:16px;height:16px}
.p-ok{background:#E6EEFA;color:var(--blue)}
.p-an{background:#F1F5FB;color:var(--ink2)}
.p-go{background:var(--blue);color:#fff}
.cright{position:absolute;right:20px;top:29px;font:500 12.5px/1 var(--sans);color:var(--ink2)}
.slot{position:absolute;left:27px;top:74px;width:326px;height:66px;border-radius:16px;border:1.5px dashed #C6D5EC;
  display:flex;align-items:center;justify-content:center;font:500 12px/1 var(--sans);color:#93A3BC}

/* contador / anel / logo */
#counter{left:282px;top:742px}
#counter small{display:block;font:600 13px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--blue)}
#counter b{display:block;margin-top:6px;font:400 118px/1 var(--serif);color:var(--navy);font-variant-numeric:tabular-nums}
#ring{width:200px;height:200px;transform-origin:50% 50%;overflow:visible}
#aptBadge{display:flex;align-items:center;gap:10px;padding:14px 20px 14px 16px;border-radius:40px;background:#fff;
  border:1px solid var(--line);box-shadow:0 24px 50px -24px rgba(5,19,42,.35);font:600 16px/1 var(--sans);color:var(--navy);transform-origin:0 50%}
#aptBadge i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff}
#logo{left:0;top:0;width:1920px;display:flex;flex-direction:column;align-items:center}
#lrow{display:flex;align-items:center;gap:44px;height:200px;margin-top:362px}
#markSlot{width:200px;height:200px}
#word{font:400 188px/1 var(--serif);color:var(--paper);letter-spacing:-.02em;transform:translateY(-6px)}
#word span{display:inline-block}
#tag{margin-top:44px;font:400 50px/1 var(--serif);color:var(--paper)}
#tag em{color:var(--sky)}
#url{margin-top:34px;display:flex;align-items:center;gap:18px;font:600 18px/1 var(--sans);letter-spacing:.16em;color:var(--sky)}
#url i{display:block;width:60px;height:1.5px;background:var(--sky);opacity:.7}
#glow{width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(25,90,180,.55),rgba(25,90,180,0) 65%)}

/* controles (fora do quadro) */
#ui{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;
  padding:10px 16px;border-radius:14px;background:rgba(5,19,42,.82);backdrop-filter:blur(10px);color:#DCE6F4;
  font:500 13px/1 var(--sans);transition:opacity .4s;width:min(720px,calc(100vw - 32px));z-index:10}
#ui button{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:rgba(143,180,232,.15)}
#ui input{flex:1;accent-color:#8FB4E8;min-width:60px}
#ui code{font:500 12px/1 ui-monospace,monospace;min-width:118px;text-align:right}
body.idle #ui{opacity:0}
body.capture #ui{display:none}
</style>
</head>
<body>
<div id="stage">
  <div class="layer rim" id="rimA"></div>
  <div class="layer" id="bgLight"></div>
  <div id="world" class="layer">
    <svg class="layer" id="apt" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
    <div class="abs" id="aptBadge"><i><svg class="ic" viewBox="0 0 24 24" width="16" height="16" style="stroke-width:2.4"><path d="m6 12.5 4 4 8-9"/></svg></i>R$ 16.000 liberados</div>
    <div class="abs" id="phone">
      <div class="ph-screen" id="screen"></div>
      <div class="ph-island"></div>
    </div>

      <line id="conLine" x1="1080" y1="500" x2="1600" y2="500" stroke="#8FB4E8" stroke-width="2" stroke-dasharray="520" stroke-dashoffset="520"/>

        <div class="brk" style="right:14px;top:14px;border-left:0;border-bottom:0;border-radius:0 8px 0 0"></div>
        <div class="brk" style="left:14px;bottom:14px;border-right:0;border-top:0;border-radius:0 0 0 8px"></div>
        <div class="brk" style="right:14px;bottom:14px;border-left:0;border-top:0;border-radius:0 0 8px 0"></div>
        <div class="det" style="left:178px;top:150px;width:200px;height:104px"><span>Acabamento ✓</span></div>
        <div class="det" style="left:40px;top:252px;width:140px;height:56px"><span>Piso ✓</span></div>
      </div>
      <div class="cap"><span>entrega_acabamento.jpg</span><span>12/10 · 14:32</span></div>
      <div class="abs" id="badge"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" style="stroke-width:2.4"><path d="m6 12.5 4 4 8-9"/></svg>Prova validada</div>
    </div>

    <div class="abs" id="orb"></div>

    <div class="abs" id="counter"><small>Obra concluída</small><b id="cnum">0%</b></div>
  </div>
  <div class="layer rim" id="rimB"></div>
  <div class="layer" id="bgDark2"></div>
  <div class="abs" id="glow"></div>
  <div class="abs" id="logo">
    <div id="lrow"><div id="markSlot"></div><div id="word"><span>A</span><span>v</span><span>a</span><span>l</span></div></div>
    <div id="tag"></div>
    <div id="url"><i></i><span>btgpactual.com/aval</span><i></i></div>
  </div>
  <svg class="abs" id="ring" viewBox="-100 -100 200 200"></svg>
  <div class="layer" id="vignette"></div>
</div>

<div id="ui">
  <button id="play" title="Play/Pause (espaço)"><svg width="12" height="12" viewBox="0 0 12 12"><path id="playIcon" d="M2 1l9 5-9 5z" fill="#DCE6F4"/></svg></button>
  <input id="scrub" type="range" min="0" max="899" step="1" value="0">
  <code id="tc">00:00 · f000</code>
</div>

<script>
/* =========================================================================
   Aval — motion graphics 30 s · 1920×1080 · 30 fps · plano contínuo
   Tudo é função do tempo t (s): render(t) é determinístico, então o filme
   pode ser assistido, navegado quadro a quadro ou exportado (render.mjs).
   ========================================================================= */
const FPS = 30, DUR = 30, FRAMES = FPS * DUR;
const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  out: x => 1 - Math.pow(1 - x, 3),
  in: x => x * x * x,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
};
// mola amortecida (resposta ao degrau), t em segundos desde o disparo
function spring(t, w = 11, z = .62) {
  if (t <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function mix(a, b, t, al = 1) {
  const A = rgb(a), B = rgb(b);
  return `rgba(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')},${al})`;
}
// entrada com blur: opacidade, blur, deslocamento
function blurIn(t, t0, d = .5, w = 10, z = .7) {
  const o = E.out(prog(t, t0, t0 + d));
  return { o, b: (1 - o) * 14, y: (1 - spring(t - t0, w, z)) * 38 };
}
function blurOut(t, t0, d = .4) { const p = E.in(prog(t, t0, t0 + d)); return { o: 1 - p, b: p * 14, y: -p * 28 }; }
// aplica transform/opacity/filter com cache para não tocar o DOM à toa
function put(el, tr, o = 1, b = 0) {
  const c = el._c || (el._c = {});
  const f = b > .05 ? `blur(${b.toFixed(2)}px)` : 'none';
  const v = o <= .002 ? 'hidden' : 'visible';
  if (c.t !== tr) el.style.transform = c.t = tr;
  const os = o.toFixed(3);
  if (c.o !== os) el.style.opacity = c.o = os;
  if (c.f !== f) el.style.filter = c.f = f;
  if (c.v !== v) el.style.visibility = c.v = v;
}
function css(el, k, v) { const c = el._s || (el._s = {}); if (c[k] !== v) el.style[k] = c[k] = v; }

/* ---------- ícones de linha (24×24) ---------- */
const IC = {
  pix: '<rect x="6" y="6" width="12" height="12" rx="2.6" transform="rotate(45 12 12)"/><path d="M9.3 9.3 12 12l2.7-2.7M9.3 14.7 12 12l2.7 2.7"/>',
  boleto: '<rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="M6 8v8M8.5 8v8M10.5 8v8M13.5 8v8M15.5 8v8M18 8v8"/>',
  cifrao: '<circle cx="12" cy="12" r="9.5"/><path d="M15.5 8.6c-.7-1-2-1.6-3.5-1.6-2 0-3.4 1-3.4 2.5 0 3.4 7 1.7 7 5.3 0 1.5-1.5 2.6-3.6 2.6-1.6 0-2.9-.6-3.6-1.7M12 5.4V7M12 17.3v1.3"/>',
  contrato: '<path d="M14.5 2.5h-8a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-12z"/><path d="M14.5 2.5v5h5"/><path d="M8 10h4M8 13.5h8"/><path d="M8 18c1.2-1.6 2-1.6 2.6 0s1.5 1.4 2.6-.2c.6-.8 1.2-.6 1.6.2"/>',
  martelo: '<path d="m14.5 12.5-8 8a2.12 2.12 0 1 1-3-3l8-8"/><path d="m16 16 6-6"/><path d="m8 8 6-6"/><path d="m9 7 8 8"/><path d="m21 11-8-8"/>',
  chave: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',

function render(t) {

  const sinY = Math.sin(ryG * Math.PI / 180), cosY = Math.cos(ryG * Math.PI / 180);
  const R = 820, R2 = 1300;
  const S = phoneState(t);

  for (const T of tiles) {
    let px, py, s, o, b;
    if (T.center) {

    } else {

    // filtro do círculo de luz

    if (!T.ch) {

        css(T.el, 'borderColor', `rgba(143,180,232,${(.26 + .6 * pulse).toFixed(3)})`);
        css(T.el, 'boxShadow', pulse > .02 ? `0 0 ${(28 * pulse).toFixed(1)}px rgba(143,180,232,${(.5 * pulse).toFixed(3)})` : 'none');
      }
      put(T.el, `translate3d(${(x - 46).toFixed(2)}px,${(y - 46).toFixed(2)}px,${z.toFixed(2)}px) rotateY(${ry.toFixed(4)}rad) rotateX(${rx.toFixed(4)}rad) scale(${s.toFixed(4)})`, o, b);

  put(el.conDot, 'none', prog(t, 9.0, 9.2) * (1 - lineOut));

    put(R_.body, 'none', 1 - gone);
    put(R_.ghost, 'none', gone * .95);

  });
  { const a = spring(t - 26.55, 9, .6); put(el.aptBadge, `translate(1560px,170px) scale(${a.toFixed(3)})`, prog(t, 26.55, 26.7) * (1 - collapse), (1 - prog(t, 26.55, 26.8)) * 6); }

  /* ---- contador + anel (vira o logo) ---- */
  const cp = E.inOut(prog(t, 23.7, 26.6));
  const ci = blurIn(t, 23.55, .5), co = blurOut(t, 27.3, .4);
  put(el.counter, `translateY(${(ci.y * .5 + co.y).toFixed(2)}px)`, ci.o * co.o, ci.b + co.b);
  const pct = Math.round(cp * 100) + '%';
  if (el.cnum._v !== pct) { el.cnum.textContent = pct; el.cnum._v = pct; }
  const rm = spring(t - 27.55, 6.4, .8);
  const [tx, ty] = LOGO.target;
  const rx = lerp(r0x, tx, rm), ry_ = lerp(r0y, ty, rm), rs = lerp(WS, 1.5, rm);
  const ringIn = spring(t - 23.5, 9, .65);
  put(el.ring, `translate(${(rx - 100).toFixed(2)}px,${(ry_ - 100).toFixed(2)}px) rotate(${((1 - ringIn) * -90 + rm * 360).toFixed(2)}deg) scale(${(rs * ringIn).toFixed(4)})`, prog(t, 23.5, 23.7));
  softCircle(el.rimB, rx, ry_, DARK * 2500 + 80 * Math.sin(Math.PI * DARK) + (DARK > 0 ? 24 : 0), 120);
  softCircle(el.bgDark2, rx, ry_, DARK * 2500, 50);
  const D = prog(t, 27.7, 28.3);
  SEG.forEach(([a, b], i) => {
    const len = (b - a - 2 * GAP) * CIRC, f = clamp((cp - a) / (b - a));
    const trk = RING.trk[i], fil = RING.fil[i];
    trk.setAttribute('stroke-dasharray', `${len.toFixed(2)} ${CIRC}`);
    trk.setAttribute('stroke', mix('#DCE6F4', '#1A3560', D));
    fil.setAttribute('stroke-dasharray', `${(len * f).toFixed(2)} ${CIRC}`);
    fil.setAttribute('opacity', clamp(f * 12).toFixed(3));
    fil.setAttribute('stroke', i % 2 ? mix('#8FB4E8', '#FBFCFE', D) : mix('#195AB4', '#8FB4E8', D));
  });
  RING.check.setAttribute('stroke-dashoffset', (70 * (1 - E.out(prog(t, 28.2, 28.65)))).toFixed(2));
  RING.check.setAttribute('opacity', prog(t, 28.2, 28.26).toFixed(3));
  RING.check.style.transform = `rotate(${(-rm * 360).toFixed(2)}deg)`;

  /* ---- manchetes ---- */
  HEADS.forEach(H => renderHead(H, t));

  /* ---- logo final ---- */
  put(el.glow, `translate(${(tx - 300).toFixed(1)}px,${(ty - 300).toFixed(1)}px) scale(${(.6 + .5 * E.out(prog(t, 28.2, 29.6))).toFixed(3)})`, prog(t, 28.2, 28.8) * .9);
  LOGO.letters.forEach((l, i) => { const a = blurIn(t, 28.35 + i * .07, .45, 9, .7); put(l, `translate(${((1 - a.o) * -24).toFixed(2)}px,${(a.y * .5).toFixed(2)}px)`, a.o, a.b); });
  LOGO.tagW.forEach((w, i) => { const a = blurIn(t, 28.75 + i * .07, .45); put(w, `translateY(${(a.y * .6).toFixed(2)}px)`, a.o, a.b); });
  { const a = blurIn(t, 29.15, .45); put(LOGO.url, `translateY(${(a.y * .4).toFixed(2)}px)`, a.o, a.b); }
  LOGO.urlLines.forEach(l => put(l, `scaleX(${E.out(prog(t, 29.25, 29.8)).toFixed(3)})`));
}

/* =========================================================================
   Player: 30 fps travados, scrub, teclado, modo captura
   ========================================================================= */
const stage = $('#stage'), ui = { play: $('#play'), icon: $('#playIcon'), scrub: $('#scrub'), tc: $('#tc') };
const qs = new URLSearchParams(location.search);
const CAPTURE = qs.has('capture');
if (CAPTURE) document.body.classList.add('capture');
let frame = 0, playing = !CAPTURE && !qs.has('t'), t0 = performance.now(), f0 = 0;
if (qs.has('t')) frame = clamp(Math.round(parseFloat(qs.get('t')) * FPS), 0, FRAMES - 1);
function fit() {
  const s = CAPTURE ? 1 : Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
function show(f) {
  frame = f;
  render(f / FPS);
  ui.scrub.value = f;
  const sec = Math.floor(f / FPS);
  ui.tc.textContent = `00:${String(sec).padStart(2, '0')}:${String(f % FPS).padStart(2, '0')} · f${String(f).padStart(3, '0')}`;
}
function setPlaying(p) {
  playing = p; t0 = performance.now(); f0 = frame;
  ui.icon.setAttribute('d', p ? 'M2 1h3v10H2zM7 1h3v10H7z' : 'M2 1l9 5-9 5z');
}
function loop(now) {
  if (playing) {
    const f = (f0 + Math.floor((now - t0) / 1000 * FPS)) % FRAMES;
    if (f !== frame) show(f);
  }
  requestAnimationFrame(loop);
}
ui.play.onclick = () => setPlaying(!playing);
ui.scrub.oninput = () => { setPlaying(false); show(+ui.scrub.value); };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  if (e.code === 'ArrowRight') { setPlaying(false); show(Math.min(FRAMES - 1, frame + (e.shiftKey ? FPS : 1))); }
  if (e.code === 'ArrowLeft') { setPlaying(false); show(Math.max(0, frame - (e.shiftKey ? FPS : 1))); }
  if (e.code === 'KeyR') { show(0); setPlaying(true); }
});
let idle; addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 2200); });
addEventListener('resize', fit);
// API para exportação quadro a quadro (render.mjs)
window.__aval = { FPS, FRAMES, frame: f => { show(f); return f; }, ready: null };
window.__aval.ready = document.fonts.ready.then(() => { measureLogo(); show(frame); });
fit(); measureLogo(); show(frame); setPlaying(playing);
requestAnimationFrame(loop);
</script>
