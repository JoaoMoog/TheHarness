name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run budget
      - run: npm test
      - run: npm run selftest
      - run: npm run selftest:dream
      - run: npm run selftest:spec
      - run: npm run eval
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        if: github.event_name != 'workflow_dispatch'
        run: npx playwright install --with-deps chromium
      - name: Install full browser matrix
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium firefox webkit
      - if: github.event_name != 'workflow_dispatch'
        run: npm run test:e2e
      - if: github.event_name == 'workflow_dispatch'
        run: npm run test:e2e:full
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
