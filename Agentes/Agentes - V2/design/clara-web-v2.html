:root{--ink:#15233e;--muted:#5e6b80;--bg:#f5f7fb;--paper:#fff;--line:#e0e6ef;--blue:#2455dc;--blue-soft:#eef2ff;--navy:#101e39;--lime:#d8ef91;--teal:#137c85;--orange:#b34d21;--orange-soft:#fff0e7;--font:Figtree,Arial,sans-serif}
