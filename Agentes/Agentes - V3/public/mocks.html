<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aval · Catálogo de mocks</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/mocks.css">
</head>
<body class="mock-catalog">
  <header class="mc-header"><div><strong>Aval</strong><h1>Catálogo de mocks</h1></div><a href="./index.html">Voltar ao aplicativo</a></header>
  <main class="mc-layout">
    <aside class="mc-library" aria-label="Funcionalidades">
      <p>Exemplos padrão das telas atuais. Tudo simulado, sem usar os dados da sua conta.</p>
      <label class="field"><span>Buscar funcionalidade</span><input id="mc-search" type="search" placeholder="Ex.: cobrar, Pix, disputa"></label>
      <label class="field"><span>Categoria</span><select id="mc-group"><option value="">Todas</option></select></label>
      <p id="mc-count" role="status"></p><nav id="mc-list" aria-label="Mocks disponíveis"></nav>
    </aside>
    <section class="mc-detail" aria-labelledby="mc-title">
      <div class="mc-meta"><small id="mc-category"></small><h2 id="mc-title"></h2><p id="mc-description"></p><p id="mc-limit" class="mc-limit"></p>
        <dl><div><dt>Identificador</dt><dd id="mc-id"></dd></div><div><dt>Rota inicial</dt><dd id="mc-route"></dd></div><div><dt>Estado</dt><dd id="mc-state"></dd></div></dl>
        <div class="mc-actions"><button id="mc-reset" type="button">Restaurar exemplo</button><a id="mc-open" target="_blank" rel="noopener">Abrir separado</a><button id="mc-download" type="button">Baixar dados do mock</button><button id="mc-copy" type="button">Copiar link</button></div>
        <p class="small muted">Código local dos exemplos: 483927. As alterações ficam só em memória. Restaurar ou recarregar volta ao padrão.</p>
        <p id="mc-feedback" role="status"></p>
      </div>
      <div class="mc-preview"><iframe id="mc-frame" title="Prévia do mock" src="about:blank"></iframe></div>
    </section>
  </main>
  <script type="module" src="/js/mocks/catalog.js"></script>
</body>
</html>
