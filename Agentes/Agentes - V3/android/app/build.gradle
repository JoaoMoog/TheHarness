plugins {
    id "com.android.application"
}

// Release signing comes from ../keystore.properties (kept out of version control), never from this file.
def keystoreFile = rootProject.file("keystore.properties")
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace "br.com.aval.prototipo"
    compileSdk 34

    defaultConfig {
        applicationId "br.com.aval.prototipo"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    // The web prototype ships inside the APK, straight from ../public: the app works offline.
    sourceSets {
        main { assets.srcDirs = [] }
        debug { assets.srcDirs = ["../../dist/validation"] }
        release { assets.srcDirs = ["../../dist/release"] }
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystore["storeFile"])
                storePassword keystore["storePassword"]
                keyAlias keystore["keyAlias"]
                keyPassword keystore["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".validation"
            versionNameSuffix "-validation"
            resValue "string", "app_name", "Aval · Teste"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def workspace = rootProject.projectDir.parentFile
def nodeExecutable = System.getProperty("os.name").toLowerCase().contains("windows") ? "node.exe" : "node"
tasks.register("buildValidationWeb", Exec) {
    workingDir workspace
    commandLine nodeExecutable, "scripts/build-web.mjs", "validation"
    inputs.dir(new File(workspace, "public"))
    inputs.file(new File(workspace, "scripts/build-web.mjs"))
    outputs.dir(new File(workspace, "dist/validation"))
}
tasks.register("buildReleaseWeb", Exec) {
    workingDir workspace
    commandLine nodeExecutable, "scripts/build-web.mjs", "release"
    inputs.dir(new File(workspace, "public"))
    inputs.file(new File(workspace, "scripts/build-web.mjs"))
    outputs.dir(new File(workspace, "dist/release"))
}
tasks.configureEach { task ->
    if (task.name == "preReleaseBuild" || (task.name.toLowerCase().contains("lint") && task.name.contains("Release"))) task.dependsOn("buildReleaseWeb")
    if (task.name == "preDebugBuild" || (task.name.toLowerCase().contains("lint") && task.name.contains("Debug"))) task.dependsOn("buildValidationWeb")
    if (task.name == "mergeDebugAssets" || task.name == "mergeReleaseAssets") {
        task.dependsOn(task.name == "mergeDebugAssets" ? "buildValidationWeb" : "buildReleaseWeb")
        // These assets are generated outside app/build; do not reuse AGP's previous merge snapshot.
        task.outputs.upToDateWhen { false }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.contains("Release") } && !keystoreFile.exists()) {
        throw new GradleException("Release build needs android/keystore.properties (storeFile, storePassword, keyAlias, keyPassword).")
    }
}
